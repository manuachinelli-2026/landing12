<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2EDE4">
<title>12·12 · Reconfirmación</title>
<meta property="og:title" content="12·12 · Reconfirmación">
<meta property="og:description" content="11—13 diciembre 2026 · Las Marianas">
<meta property="og:image" content="images/og-preview.jpg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* paleta del repo (index.html) */
:root {
  --cream:      #F2EDE4;
  --title:      #1E2D5A;
  --terracotta: #C1654A;
  --mustard:    #D4940A;
  --green-dark: #1A4D2E;
  --green-mid:  #4A5320;
  --teal:       #1C3D35;
  --rust:       #9B2F1F;
  --brown:      #8B4513;
  --shadow:     #8B5E3C;
  --line:       #A89060;
  --display: 'Bebas Neue', Impact, sans-serif;
  --cond:    'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body:    'Barlow', system-ui, sans-serif;
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; background: #0d0d0d; overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); color: #fff; display: grid; place-items: center; }

#stage { position: relative; width: 100vw; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
@media (min-width: 600px) {
  #stage { width: min(440px, calc(100dvh * 9 / 16)); height: min(100dvh - 40px, 860px); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
}

/* ── chrome: barras + header tipo IG ── */
#chrome { position: absolute; z-index: 20; top: 0; left: 0; right: 0; padding: calc(var(--top) + 10px) 10px 0; pointer-events: none; }
#bars { display: flex; gap: 4px; }
.bar { flex: 1; height: 2.5px; border-radius: 2px; background: color-mix(in srgb, currentColor 30%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: currentColor; }
#head { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
#avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px currentColor; }
#avatar img { display: block; width: 100%; height: 100%; }
#paused { margin-left: auto; font-family: var(--cond); font-size: 12px; letter-spacing: .14em; opacity: 0; transition: opacity .2s; }
#stage.is-paused #paused { opacity: .85; }

/* ── slides ── */
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg); transition: background-color .45s;
  padding: calc(var(--top) + 78px) 24px calc(var(--bot) + 28px); overflow: hidden; }
.slide.active { opacity: 1; visibility: visible; }
.content { position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; }

.bg-cream  { --bg: #F2EDE4; --fg: #1E2D5A; }
.bg-teal   { --bg: #1C3D35; --fg: #F2EDE4; }
.bg-green  { --bg: #1A4D2E; --fg: #F2EDE4; }
.bg-olive  { --bg: #4A5320; --fg: #F2EDE4; }
.bg-terra  { --bg: #C1654A; --fg: #F2EDE4; }
.bg-rust   { --bg: #9B2F1F; --fg: #F2EDE4; }
.bg-brown  { --bg: #8B4513; --fg: #F2EDE4; }
.bg-mustard{ --bg: #D4940A; --fg: #1E2D5A; }
.bg-navy   { --bg: #1E2D5A; --fg: #F2EDE4; }
.bg-slate  { --bg: #3D5568; --fg: #F2EDE4; }

/* entrada */
.a { opacity: 0; transform: translateY(18px); }
.slide.active .a { animation: up .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 90ms + 80ms); }
@keyframes up { to { opacity: 1; transform: none; } }
.slide.active .pop { animation: pop .55s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i, 0) * 90ms + 80ms); }
@keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }

/* ── cubos del home ── */
.cubes { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.cube { position: absolute; width: var(--s); height: var(--s); }
.cube::before { content: ''; position: absolute; inset: 0; background: var(--shadow); opacity: .55; transform: translate(calc(var(--s) * .12), calc(var(--s) * .12)); transition: opacity .7s; }
.cube::after  { content: ''; position: absolute; inset: 0; background: var(--c); animation: float var(--d, 1.2s) ease-in-out infinite; animation-delay: var(--dl, 0s); transition: opacity .7s; }
@keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.03); } }
.slide.active .cubes .cube { animation: cubeIn .5s cubic-bezier(.3,1.4,.5,1) both; animation-delay: var(--dl, 0s); }
@keyframes cubeIn { from { opacity: 0; transform: scale(.3); } }

.cube-grid { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 240px; align-self: center; }
.cube-grid .cell { position: relative; aspect-ratio: 1; }
.cube-grid .cube { inset: 7px; width: auto; height: auto; --s: 44px; }
.cube-grid .cube.off::before, .cube-grid .cube.off::after { opacity: 0; }

/* type */
.kicker { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .28em; text-transform: uppercase; opacity: .85; }
.mega { font-family: var(--display); font-size: clamp(88px, 30vw, 132px); line-height: .82; letter-spacing: .01em; }
.big  { font-family: var(--display); font-size: clamp(56px, 17vw, 78px); line-height: .9; letter-spacing: .01em; }
.lead { font-size: 17px; line-height: 1.4; max-width: 30ch; }
.center { text-align: center; align-items: center; }

/* ── stickers IG ── */
.sticker { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; background: #fff; color: var(--title);
  border-radius: 10px; padding: 9px 14px; font-family: var(--cond); font-weight: 700; font-size: 18px; letter-spacing: .04em;
  text-transform: uppercase; box-shadow: 0 6px 18px rgba(0,0,0,.18); text-decoration: none; }
.sticker.loc .pin { width: 18px; height: 18px; flex: none; }
.sticker.loc span { color: var(--terracotta); }
.sticker.loc em { font-style: normal; font-size: 11px; letter-spacing: .1em; opacity: .55; margin-left: 4px; white-space: nowrap; }
.sticker.tag { font-size: 15px; padding: 7px 12px; }

.clock { display: inline-flex; gap: 4px; align-self: flex-start; }
.clock b { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; background: #fff; color: var(--title);
  border-radius: 10px; padding: 6px 10px 0; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.clock b.colon { background: none; color: var(--fg); box-shadow: none; padding: 6px 0 0; }

.card { background: #fff; color: var(--title); border-radius: 18px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.22); }
.card-h { padding: 14px 16px 12px; color: #fff; font-family: var(--cond); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; }
.card-b { padding: 6px 16px 16px; }

/* portada (estilo hero del home) */
.cover { gap: 0; padding-bottom: 30px; }
.cover-head { display: flex; flex-direction: column; align-items: center; }
.cover-date { font-family: var(--display); font-size: clamp(84px, 26vw, 108px); line-height: .82; letter-spacing: .02em; color: var(--terracotta); }
.cover-label { font-family: var(--cond); font-weight: 400; font-size: 12px; letter-spacing: 7px; text-transform: uppercase; color: #5C4827; margin-top: 10px; padding-left: 7px; }
.cover-rule { width: 28px; height: 2px; background: var(--terracotta); margin: 12px 0 10px; }
.cover-loc { font-family: var(--cond); font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: .02em; color: #5C4827; }
.cover .cube-grid { width: min(216px, 26dvh); margin-top: 18px; }
.cover .count { width: min(216px, 26dvh); max-width: none; margin-top: 18px; border-radius: 14px; }
.cover .count .card-h { padding: 7px 12px 6px; font-size: 12px; }
.cover .count .digits { gap: 12px; padding: 6px 10px 8px; }
.cover .count .digits b { font-size: 30px; }
.cover .count .digits small { font-size: 9.5px; }

/* countdown */
.count { align-self: center; width: 100%; max-width: 320px; }
.count .card-h { background: var(--terracotta); text-align: center; }
.count .digits { display: flex; justify-content: center; gap: 14px; padding: 12px 10px 14px; }
.count .digits div { text-align: center; }
.count .digits b { display: block; font-family: var(--display); font-weight: 400; font-size: 48px; line-height: 1; color: var(--title); }
.count .digits small { font-family: var(--cond); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--line); }

/* tips */
.tips .card-h { background: var(--hdr); }
.tips ol { list-style: none; counter-reset: t; }
.tips li { counter-increment: t; display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 12px 0; border-top: 1px dashed #e4dccd; font-size: 15.5px; line-height: 1.35; }
.tips li:first-child { border-top: 0; }
.tips li::before { content: counter(t, decimal-leading-zero); font-family: var(--display); font-size: 22px; line-height: 1.05; color: var(--hdr); }
.tips li b { font-weight: 700; }
.tipcards { display: flex; flex-direction: column; gap: 10px; }
.tipcard { display: flex; align-items: center; gap: 14px; background: #fff; color: var(--title); border-radius: 16px; padding: 12px 16px 12px 12px; box-shadow: 0 10px 26px rgba(0,0,0,.2); font-size: 16px; line-height: 1.3; }
.tipcard i { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--cream); font-style: normal; font-size: 24px; }
.tipcard b { font-weight: 700; color: var(--rust); }

/* timeline sábado */
.tl { display: grid; gap: 14px; }
.tl-row { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.tl-row .clock b { font-size: 46px; padding: 5px 8px 0; }
.tl-row h3 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: .95; }
.tl-row .sticker { margin-top: 6px; font-size: 13px; padding: 6px 10px; }
.tl-dash { margin-left: 46px; width: 2px; height: 22px; background: repeating-linear-gradient(currentColor 0 4px, transparent 4px 8px); opacity: .7; }

/* dress code: fotos como cubos */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-right: 8px; }
.photo { position: relative; }
.photo::before { content: ''; position: absolute; inset: 0; background: var(--shadow); opacity: .55; transform: translate(8px, 8px); }
.photo img { position: relative; display: block; width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #ddd; }
/* moodboard: grilla de collages que se abren en grande */
.moods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; width: min(100%, 44dvh); padding-right: 8px; }
.mood { padding: 0; border: 0; background: none; cursor: zoom-in; }
.moods-hint { font-family: var(--cond); font-weight: 600; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; opacity: .7; }
#lightbox { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: calc(var(--top) + 56px) 16px calc(var(--bot) + 34px);
  background: rgba(10, 10, 10, .94); opacity: 0; pointer-events: none; transition: opacity .2s; cursor: zoom-out; }
#lightbox.on { opacity: 1; pointer-events: auto; }
#lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
.dc-board { flex: 1 1 auto; min-height: 0; max-height: 440px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; padding-right: 8px; }
.dc-side { display: grid; grid-template-rows: 1fr 1fr; gap: 14px; min-height: 0; }
.dc-board .mood { min-height: 0; }
.dc-board .photo img { height: 100%; aspect-ratio: auto; object-position: top; }
.dc-tag { position: absolute; left: 8px; bottom: 8px; z-index: 1; padding: 5px 9px 4px; border-radius: 8px; background: #fff; color: var(--title);
  font-family: var(--cond); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.no-bw { color: var(--rust); font-size: 15px; }
/* tarjetas con varias fotos: cartas apiladas + ícono de carrusel tipo IG */
.dc-stack { isolation: isolate; }
.dc-stack::after { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--cream); opacity: .85; transform: translate(6px, -6px); }
.dc-multi { position: absolute; top: 8px; right: 8px; z-index: 1; width: 30px; height: 30px; padding: 5px; border-radius: 9px; background: rgba(0,0,0,.5); }
.dc-multi svg { display: block; width: 100%; height: 100%; }
#lightbox .nav { display: none; position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 26px; line-height: 38px; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
#lightbox .prev { left: 10px; } #lightbox .next { right: 10px; }
#lightbox .count { display: none; position: absolute; left: 0; right: 0; bottom: calc(var(--bot) + 4px); text-align: center; color: #fff; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .2em; opacity: .7; }
#lightbox.multi .nav, #lightbox.multi .count { display: block; }
#lightbox .x { position: absolute; top: calc(var(--top) + 14px); right: 14px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 20px; line-height: 36px; }
.nope { display: flex; gap: 10px; align-items: center; font-family: var(--cond); font-weight: 600; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.tags { display: flex; gap: 10px; flex-wrap: wrap; }

/* agenda */
.week { display: grid; gap: 12px; }
.wk { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; color: var(--cream); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
.wk b { font-family: var(--display); font-weight: 400; font-size: 48px; line-height: .9; min-width: 48px; text-align: center; }
.wk div { font-family: var(--cond); line-height: 1.15; }
.wk div strong { display: block; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.wk div span { font-size: 15px; opacity: .9; }

/* regalo */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0,0,0,.22); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { font: 700 16px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: #fff; background: none; border: 0; border-radius: 9px; padding: 10px 0; }
.seg button.on { background: #fff; color: var(--brown); }
.acct .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid #efe7d8; }
.acct .row:first-child { border-top: 0; }
.acct small { display: block; font-family: var(--cond); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--line); }
.acct span { font-size: 15.5px; font-weight: 600; word-break: break-all; }
.copy { flex: none; font: 700 13px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--brown); border: 0; border-radius: 8px; padding: 8px 11px; }
.copy.ok { background: var(--green-dark); }
/* regalo sobre bordó: acentos en mostaza */
.bg-rust .seg button.on { color: var(--rust); }
.bg-rust .copy { background: var(--mustard); color: var(--title); }
.bg-rust .lead b { color: var(--mustard); }

/* ── preguntas estilo IG ── */
.q { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 16px; }
.q.on { display: flex; }
.q.on .qs { animation: pop .5s cubic-bezier(.3,1.5,.5,1) both; }
.step-n { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; opacity: .85; text-align: center; }

/* encuesta */
.poll { background: #fff; color: var(--title); border-radius: 18px; box-shadow: 0 14px 34px rgba(0,0,0,.25); padding: 20px 14px 14px; }
.poll h3 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; text-align: center; padding: 0 6px 16px; }
.poll .opts { display: grid; gap: 8px; }
.poll button { position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; font: 700 18px var(--cond);
  letter-spacing: .05em; text-transform: uppercase; color: var(--title); background: #f3eee6; border: 0; border-radius: 12px; padding: 15px 16px; text-align: left; }
.poll button .fill { position: absolute; inset: 0; width: 0; background: var(--qc); opacity: .3; transition: width .55s cubic-bezier(.2,.8,.2,1); }
.poll button span { position: relative; }
.poll button .ck { opacity: 0; transition: opacity .2s; }
.poll button.picked .fill { width: 100%; }
.poll button.picked .ck { opacity: 1; }
.poll.voted button:not(.picked) { opacity: .45; }
.poll .note { font-family: var(--cond); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; text-align: center; color: var(--line); padding-top: 10px; }

/* caja de preguntas */
.qbox { border-radius: 18px; overflow: hidden; box-shadow: 0 14px 34px rgba(0,0,0,.25); }
.qbox .top { background: var(--qc); color: #fff; padding: 24px 18px 20px; text-align: center; font-family: var(--display); font-size: 34px; line-height: 1; }
.qbox .body { background: #fff; padding: 14px; display: grid; gap: 8px; }
.qbox input { width: 100%; min-width: 0; font: 600 17px var(--body); color: var(--title); background: #f3eee6; border: 0; border-radius: 10px; padding: 14px; outline: none; user-select: text; -webkit-user-select: text; }
.fam-add { font: 700 16px var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--title); background: none; border: 2px dashed #d9cdb8; border-radius: 10px; padding: 13px; }
.fam-hint { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; text-align: center; opacity: .85; }
.qbox input::placeholder { color: #b3a894; font-weight: 400; }
.qbox input:focus { box-shadow: inset 0 0 0 2px var(--qc); }

.cta { font: 400 26px var(--display); letter-spacing: .06em; color: var(--bg); background: var(--fg); border: 0; border-radius: 14px; padding: 15px 0 11px; width: 100%; }
.cta:disabled { opacity: .35; }
.cta.ghost { background: none; color: var(--fg); border: 1.5px solid var(--fg); font-size: 20px; padding: 12px 0 9px; }
.err { color: #fff; background: var(--rust); border-radius: 8px; font-size: 14px; text-align: center; max-height: 0; overflow: hidden; transition: .2s; }
.err.on { padding: 8px; max-height: 60px; }

.summary div { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-top: 1px solid #efe7d8; font-size: 15.5px; }
.summary div:first-child { border-top: 0; }
.summary small { font-family: var(--cond); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--line); padding-top: 2px; white-space: nowrap; }
.summary b { text-align: right; font-weight: 600; }

.hint { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(var(--bot) + 22px); text-align: center; font-family: var(--cond);
  font-weight: 600; font-size: 13px; letter-spacing: .24em; text-transform: uppercase; opacity: .7; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(8px); opacity: 1; } }

#toast { position: absolute; z-index: 30; left: 50%; bottom: calc(var(--bot) + 40px); transform: translate(-50%, 20px); opacity: 0; background: rgba(20,20,20,.88);
  color: #fff; font: 600 14px var(--body); padding: 10px 16px; border-radius: 999px; transition: .25s; pointer-events: none; white-space: nowrap; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }

.bit { position: absolute; z-index: 25; top: -40px; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110dvh) rotate(400deg); } }

@media (max-height: 720px) {
  .tipcards { gap: 8px; } .tipcard { padding: 9px 14px 9px 10px; font-size: 14.5px; } .tipcard i { width: 38px; height: 38px; font-size: 20px; }
  .mega { font-size: 90px; } .big { font-size: 54px; } .tips li { padding: 9px 0; font-size: 14.5px; }
  .slide { padding-top: calc(var(--top) + 70px); } .cube-grid { max-width: 190px; } .photos { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
<main id="stage">
  <div id="chrome">
    <div id="bars"></div>
    <div id="head">
      <div id="avatar"><img src="favicon.svg" alt=""></div>
      <div id="paused">❚❚ PAUSA</div>
    </div>
  </div>
  <div id="slides"></div>
  <div id="toast"></div>
  <div id="lightbox" class="no-tap"><img alt=""><button class="nav prev" aria-label="Anterior">‹</button><button class="nav next" aria-label="Siguiente">›</button><div class="count"></div><button class="x" aria-label="Cerrar">✕</button></div>
</main>

<script>
/* ═════════════ CONFIG ═════════════ */

/* ═════════════ RENDER ═════════════ */
const stage = document.getElementById('stage');
const slidesEl = document.getElementById('slides');
const barsEl = document.getElementById('bars');
slidesEl.innerHTML = S.map((s, i) => `<section class="slide ${s.bg} ${s.cls || ''}" data-i="${i}">${s.html}</section>`).join('');
barsEl.innerHTML = S.map(() => '<div class="bar"><i></i></div>').join('');
const slides = [...slidesEl.children];
const fills = [...barsEl.querySelectorAll('i')];

/* ═════════════ ENGINE ═════════════ */
let cur = 0, t0 = 0, elapsed = 0, paused = false;
const durOf = i => QS.has('still') ? Infinity : (S[i].dur ?? AUTO_MS);

function paint() {
  const cs = getComputedStyle(slides[cur]);
  document.getElementById('chrome').style.color = cs.getPropertyValue('--fg');
  document.querySelector('meta[name=theme-color]').content = cs.getPropertyValue('--bg').trim();
}
function show(i) {
  i = Math.max(0, Math.min(S.length - 1, i));
  leaveStory();
  slides[cur].classList.remove('active');
  cur = i; elapsed = 0; t0 = performance.now();
  const el = slides[cur]; void el.offsetWidth; el.classList.add('active');
  fills.forEach((f, n) => f.style.width = n < cur ? '100%' : '0');
  if (durOf(cur) === Infinity) fills[cur].style.width = '100%';
  paint();
  viewStory();
}
function tick(now) {
  const d = durOf(cur);
  if (!paused && d !== Infinity) {
    elapsed += now - t0;
    fills[cur].style.width = Math.min(100, elapsed / d * 100) + '%';
    if (elapsed >= d) next();
  }
  t0 = now;
  requestAnimationFrame(tick);
}
const next = () => cur < S.length - 1 && show(cur + 1);
const prev = () => show(cur - 1);
const navNext = () => { T.nav.adelante++; next(); };
const navPrev = () => { T.nav.atras++; prev(); };
const chapterOf = i => S[i].chapter.split(' · ')[0];
function jumpChapter(dir) {
  const c = chapterOf(cur); let i = cur;
  if (dir > 0) { while (i < S.length - 1 && chapterOf(i) === c) i++; }
  else { while (i > 0 && chapterOf(i) === c) i--; const c2 = chapterOf(i); while (i > 0 && chapterOf(i - 1) === c2) i--; }
  show(i);
}
const setPaused = p => { paused = p; stage.classList.toggle('is-paused', p && durOf(cur) !== Infinity); };

// gestos: tap izq/der · mantener = pausa · swipe horizontal = cambiar de día
let down = null, holdT = 0;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('a, button, input, label, .no-tap')) return;
  down = { x: e.clientX, y: e.clientY, held: false };
  holdT = setTimeout(() => { if (down) down.held = true; setPaused(true); }, 220);
});
stage.addEventListener('pointerup', e => {
  clearTimeout(holdT);
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, held = down.held;
  down = null; setPaused(false);
  if (held) { T.nav.pausas++; return; }
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { T.nav.swipes++; return jumpChapter(dx < 0 ? 1 : -1); }
  if (Math.abs(dy) > 50) return;
  const r = stage.getBoundingClientRect();
  (e.clientX - r.left < r.width * .3) ? navPrev() : navNext();
});
stage.addEventListener('pointercancel', () => { clearTimeout(holdT); down = null; setPaused(false); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input') || document.getElementById('lightbox').classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === ' ') navNext();
  if (e.key === 'ArrowLeft') navPrev();
});
document.addEventListener('visibilitychange', () => setPaused(document.hidden));

let gal = [], gi = 0, lbX = null, lbSwiped = false;
const lbShow = () => {
  lightbox.querySelector('img').src = gal[gi];
  lightbox.classList.toggle('multi', gal.length > 1);
  lightbox.querySelector('.count').textContent = `${gi + 1} / ${gal.length}`;
};
const lbStep = d => { gi = (gi + d + gal.length) % gal.length; lbShow(); };
const closeLightbox = () => { if (!lightbox.classList.contains('on')) return; lightbox.classList.remove('on'); setPaused(false); };
stage.addEventListener('click', e => {
  const m = e.target.closest('.mood'); if (!m) return;
  gal = GALLERIES[m.dataset.gal]; gi = +m.dataset.idx; lbShow(); lightbox.classList.add('on'); setPaused(true);
});
lightbox.addEventListener('pointerdown', e => { lbX = e.clientX; });
lightbox.addEventListener('pointerup', e => {
  const dx = lbX === null ? 0 : e.clientX - lbX; lbX = null;
  if (gal.length > 1 && Math.abs(dx) > 40) { lbSwiped = true; lbStep(dx < 0 ? 1 : -1); }
});
lightbox.addEventListener('click', e => {
  if (lbSwiped) { lbSwiped = false; return; }
  if (e.target.closest('.prev')) return lbStep(-1);
  if (e.target.closest('.next') || (e.target.tagName === 'IMG' && gal.length > 1)) return lbStep(1);
  closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('on')) return;
  if (e.key === 'Escape') closeLightbox();
  if (gal.length > 1 && e.key === 'ArrowRight') lbStep(1);
  if (gal.length > 1 && e.key === 'ArrowLeft') lbStep(-1);
});
stage.addEventListener('contextmenu', e => e.preventDefault());

/* ═════════════ TRACKING (tipo pixel) ═════════════ */
// Cada visita manda al Sheet: qué historias vio, cuánto tiempo, qué tocó y hasta qué pregunta llegó.
// Pestañas: "Visitas" (una fila por visita, se va actualizando) y "Eventos" (una fila por cosa que pasó).
const TRACK = !QS.has('notrack');
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const VID = (() => { try { let v = localStorage.getItem('1212_vid'); if (!v) { v = rid(); localStorage.setItem('1212_vid', v); } return v; } catch { return rid(); } })();
const T = {
  sid: rid(), start: Date.now(), viewStart: Date.now(), seen: new Set(), ms: {}, clicks: [], queue: [],
  preguntas: new Set(), nav: { adelante: 0, atras: 0, swipes: 0, pausas: 0 }, enviado: false,
};
const ua = navigator.userAgent;
const DEVICE = /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : 'Desktop';
const APP = /Instagram/.test(ua) ? 'Instagram' : /FBAN|FBAV/.test(ua) ? 'Facebook' : /WhatsApp/.test(ua) ? 'WhatsApp' : 'Navegador';

function track(event, detail = '') {
  if (!TRACK) return;
  T.queue.push({ hora: new Date().toISOString(), evento: event, historia_n: cur + 1, historia: S[cur].chapter, detalle: String(detail).slice(0, 200) });
}
function leaveStory() { const k = cur + 1; T.ms[k] = (T.ms[k] || 0) + (Date.now() - T.viewStart); }
function viewStory() {
  T.viewStart = Date.now(); T.seen.add(cur + 1); track('historia', S[cur].chapter);
  if (cur === S.length - 1 && typeof qCur !== 'undefined') T.preguntas.add(qCur);
}

// qué tocó: links, botones, chips… (data-track manda, si no se arma solo)
stage.addEventListener('click', e => {
  const el = e.target.closest('a, button'); if (!el) return;
  const pollEl = el.closest('.poll');
  const what = el.dataset.track
    || (pollEl ? `${pollEl.id.replace(/^p-/, '')} = ${el.dataset.v}` : '')
    || (el.hasAttribute('data-next') ? `seguir (${qCur})` : '')
    || (el.classList.contains('copy') ? `copiar ${document.querySelector('.seg .on')?.dataset.cur} ${el.closest('.row')?.querySelector('small')?.textContent}` : '')
    || (el.closest('.seg') ? `moneda ${el.dataset.cur}` : '')
    || (el.matches('a.loc') ? `maps ${el.querySelector('span')?.textContent}` : '')
    || el.id || el.textContent.trim().slice(0, 40);
  T.clicks.push(what); track('click', what);
}, true);

// todas las preguntas van siempre (vacías si no le tocaron), así una reconfirmación pisa la anterior
function answers() {
  const out = {};
  const asked = flow();
  if (needsBus()) asked.push('bus');                                // pudo contestarlo en la historia del bus
  Object.keys(Q).filter(q => !['resumen', 'gracias'].includes(q)).forEach(q => {
    if (q === 'nombre') { out.nombre = A.nombre || ''; out.apellido = A.apellido || ''; return; }
    const v = asked.includes(q) ? A[q] : '';
    out[COLUMN[q] || q] = Array.isArray(v) ? v.join(', ') : (v ?? '');
  });
  return out;
}
const COLUMN = { venis: 'asistencia' };    // nombre de columna en el Sheet (si no está acá, usa el data-q)

function summary() {
  leaveStory(); T.viewStart = Date.now();
  const r = answers();
  return {
    sesion: T.sid, visitante: VID, grupo: invited.join('').toUpperCase(), test: QS.has('test') || QS.has('still') ? 'Sí' : '',
    inicio: new Date(T.start).toISOString(), segundos: Math.round((Date.now() - T.start) / 1000),
    dispositivo: DEVICE, app: APP, referrer: document.referrer,
    historias_total: S.length, historias_vistas: T.seen.size, max_historia: Math.max(...T.seen),
    ultima_historia: `${cur + 1} · ${S[cur].chapter}`,
    historias: [...T.seen].sort((a, b) => a - b).join(' · '),
    tiempo_por_historia: Object.entries(T.ms).map(([k, ms]) => `${k}: ${Math.round(ms / 1000)}s`).join(' · '),
    clicks: T.clicks.length, clickeo: [...new Set(T.clicks)].join(' | '),
    taps_adelante: T.nav.adelante, taps_atras: T.nav.atras, swipes: T.nav.swipes, pausas: T.nav.pausas,
    preguntas_vistas: [...T.preguntas].join(' · '),
    nombre: r.nombre || '', apellido: r.apellido || '',
    respuestas: Object.entries(r).filter(([k]) => !['nombre', 'apellido'].includes(k)).map(([k, v]) => `${k}: ${v}`).join(' | '),
    confirmo: T.enviado ? 'Sí' : 'No',
  };
}
function post(payload, beacon) {
  const body = JSON.stringify(payload);
  if (beacon && navigator.sendBeacon && navigator.sendBeacon(SCRIPT_URL, new Blob([body], { type: 'text/plain;charset=utf-8' }))) return Promise.resolve();
  return fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', keepalive: body.length < 60000, headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body });
}
let lastFlush = '';
function flush() {
  if (!TRACK) return;
  const session = summary();
  const sig = JSON.stringify({ ...session, segundos: 0 });
  if (!T.queue.length && sig === lastFlush) return;          // nada nuevo
  lastFlush = sig;
  post({ type: 'track', session, events: T.queue.splice(0) }, true).catch(() => {});
}
setInterval(flush, 15000);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
addEventListener('pagehide', flush);

/* ═════════════ PORTADA ═════════════ */
function countdown() {
  const s = Math.max(0, (WEDDING - Date.now()) / 1000);
  const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60)];
  document.getElementById('cd').innerHTML = [['días', v[0]], ['horas', v[1]], ['min', v[2]]]
    .map(([l, n]) => `<div><b>${String(n).padStart(2, '0')}</b><small>${l}</small></div>`).join('');
}
countdown(); setInterval(countdown, 30000);

// cubos que se apagan y prenden, como en el home
const gridCubes = [...document.querySelectorAll('#cubeGrid .cube')];
const off = new Set();
(function toggle() {
  if (off.size < 3 && Math.random() > .35) {
    const on = gridCubes.filter(c => !off.has(c)); const c = on[Math.floor(Math.random() * on.length)];
    off.add(c); c.classList.add('off');
  } else if (off.size) {
    const c = [...off][Math.floor(Math.random() * off.size)]; off.delete(c); c.classList.remove('off');
  }
  setTimeout(toggle, 200 + Math.random() * 400);
})();

/* ═════════════ REGALO ═════════════ */
const toast = msg => { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 1600); };
function renderAcct(k) {
  document.getElementById('acct').innerHTML = ACCOUNTS[k].rows.map(([l, v]) =>
    `<div class="row"><div><small>${l}</small><span>${v}</span></div>${/CBU|Alias|IBAN|BIC/.test(l) ? `<button class="copy" data-copy="${v}">Copiar</button>` : ''}</div>`).join('');
}
renderAcct('ARS');
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
  renderAcct(b.dataset.cur);
});
document.getElementById('acct').addEventListener('click', async e => {
  const b = e.target.closest('.copy'); if (!b) return;
  const v = b.dataset.copy.replace(/\s/g, '');
  try { await navigator.clipboard.writeText(v); }
  catch { const ta = Object.assign(document.createElement('textarea'), { value: v }); document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  b.textContent = '✓ Copiado'; b.classList.add('ok'); toast('Copiado');
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1800);
});

/* ═════════════ CONFIRMACIÓN ═════════════ */
const $ = id => document.getElementById(id);
const rsvpSlide = slides[S.length - 1];
const Q = {};
rsvpSlide.querySelectorAll('.q').forEach(el => Q[el.dataset.q] = el);
const A = { dias: invited.map(dayLabel) };
let qCur = 'venis';

const yes = () => A.venis === 'Sí, voy';
const goes = day => yes() && A.dias.some(d => d.startsWith(day));
// hospedaje: solo quien viene desde el viernes (el domingo la gente ya se va) · bus: solo quien va el sábado
const needsHosp = () => goes('Viernes');
const needsBus = () => goes('Sábado');
let busFromStory = false;     // si ya contestó en la historia del bus, no se repregunta
// qué preguntas aparecen según las respuestas
function flow() {
  if (!yes()) return ['venis', 'nombre', 'resumen'];
  const f = ['venis', 'nombre'];
  if (FAMILY) { f.push('familia'); if (A.familia === FAM_YES) f.push('familiares'); }
  if (invited.length > 1) f.push('dias');
  if (needsHosp()) f.push('hospedaje');
  if (needsBus() && !busFromStory) f.push('bus');
  f.push('menu', 'resumen');
  return f;
}
function goQ(q) {
  Q[qCur].classList.remove('on');
  qCur = q;
  const el = Q[q]; void el.offsetWidth; el.classList.add('on');
  rsvpSlide.className = rsvpSlide.className.replace(/\bbg-\w+/, el.dataset.bg);
  const f = flow(), n = f.indexOf(q);
  const tag = el.querySelector('[data-n]');
  if (tag) tag.textContent = q === 'resumen' ? 'Último paso' : `Pregunta ${n + 1} de ${f.length - 1}`;
  if (q === 'resumen') renderSummary();
  paint();
  T.preguntas.add(q); track('pregunta', q);
}
const advance = () => { const f = flow(); goQ(f[f.indexOf(qCur) + 1]); };
const err = (id, msg) => { $(id).textContent = msg; $(id).classList.toggle('on', !!msg); };

// encuestas de una sola opción → guardan en A[data-q] y avanzan solas.
// Para sumar una pregunta: agregar <div class="q" data-q="clave" data-bg="…">${poll(…)}</div> y meter 'clave' en flow().
// Llega sola al Sheet como columna "clave".
rsvpSlide.querySelectorAll('.q').forEach(qEl => {
  const p = qEl.querySelector('.poll'); if (!p || qEl.dataset.q === 'dias') return;
  p.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || p.classList.contains('voted')) return;
    A[qEl.dataset.q] = b.dataset.v;
    if (qEl.dataset.q === 'menu') {      // "Alergia u otra" pide escribir cuál; el resto avanza
      const otra = b.dataset.v === MENU_OTRA;
      Q.menu.querySelector('.alg').hidden = $('alg-next').hidden = !otra;
      p.querySelectorAll('button').forEach(x => x.classList.toggle('picked', x === b));
      if (otra) return $('f-alg').focus();
    }
    p.classList.add('voted');
    p.querySelectorAll('button').forEach(x => x.classList.toggle('picked', x === b));
    if (navigator.vibrate) navigator.vibrate(15);
    setTimeout(advance, 600);
  });
});
// historia del bus: guarda la respuesta y sigue a la próxima historia
if ($('p-bus-story')) $('p-bus-story').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  A.bus = b.dataset.v; busFromStory = true;
  $('p-bus-story').classList.add('voted');
  $('p-bus-story').querySelectorAll('button').forEach(x => x.classList.toggle('picked', x === b));
  if (navigator.vibrate) navigator.vibrate(15);
  setTimeout(next, 700);
});
// días: multi-selección, arrancan todos marcados
$('p-dias').querySelectorAll('button').forEach(b => b.classList.add('picked'));
$('p-dias').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  b.classList.toggle('picked');
  A.dias = [...$('p-dias').querySelectorAll('button.picked')].map(x => x.dataset.v);
});
rsvpSlide.querySelectorAll('[data-next]').forEach(b => b.addEventListener('click', () => {
  if (qCur === 'nombre') {
    A.nombre = $('f-n').value.trim(); A.apellido = $('f-a').value.trim();
    if (!A.nombre || !A.apellido) return err('err-n', 'Completá nombre y apellido.');
    err('err-n', ''); document.activeElement.blur();
  }
  if (qCur === 'menu') {
    const cual = $('f-alg').value.trim();
    if (!cual) return err('err-m', 'Contanos cuál.');
    A.menu = `${MENU_OTRA}: ${cual}`; err('err-m', ''); document.activeElement.blur();
  }
  if (qCur === 'familiares') {
    A.familiares = [...document.querySelectorAll('#fam-list .fam')].map(i => i.value.trim()).filter(Boolean);
    if (!A.familiares.length) return err('err-f', 'Agregá al menos un nombre.');
    err('err-f', ''); document.activeElement.blur();
  }
  if (qCur === 'dias' && !A.dias.length) return err('err-d', 'Elegí al menos un día.');
  if (qCur === 'dias') err('err-d', '');
  advance();
}));
function addFam() {
  const i = Object.assign(document.createElement('input'), { className: 'fam', placeholder: 'Nombre', autocomplete: 'off', enterKeyHint: 'next' });
  $('fam-add').before(i); i.focus();
}
$('fam-add').addEventListener('click', addFam);
$('fam-list').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('.fam')) return;
  const next = e.target.nextElementSibling;
  next && next.matches('.fam') ? next.focus() : addFam();
});
const famList = () => (yes() && A.familia === FAM_YES && A.familiares) || [];
$('f-n').addEventListener('keydown', e => { if (e.key === 'Enter') $('f-a').focus(); });
$('f-a').addEventListener('keydown', e => { if (e.key === 'Enter') Q.nombre.querySelector('[data-next]').click(); });
$('f-alg').addEventListener('keydown', e => { if (e.key === 'Enter') $('alg-next').click(); });

function renderSummary() {
  const rows = [['Nombre', `${A.nombre} ${A.apellido}`], ['¿Venís?', A.venis]];
  if (famList().length) rows.push(['Familia', famList().join(', ')]);
  if (yes()) {
    if (invited.length > 1) rows.push(['Días', A.dias.join(', ')]);
    if (needsHosp()) rows.push(['Hospedaje', A.hospedaje]);
    if (needsBus()) rows.push(['Bus el sábado', A.bus]);
    rows.push(['Restricción', A.menu]);
  }
  $('summary').innerHTML = rows.map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join('');
}
$('restart').addEventListener('click', () => {
  rsvpSlide.querySelectorAll('.poll:not(#p-dias)').forEach(p => { p.classList.remove('voted'); p.querySelectorAll('button').forEach(b => b.classList.remove('picked')); });
  delete A.venis; delete A.hospedaje; delete A.menu; delete A.familia; delete A.familiares;
  Q.menu.querySelector('.alg').hidden = $('alg-next').hidden = true; $('f-alg').value = '';
  if (!busFromStory) delete A.bus;
  goQ('venis');
});

$('send').addEventListener('click', async () => {
  $('send').disabled = true; $('send').textContent = 'Enviando…';
  try {
    T.enviado = true;
    track('enviado', yes() ? 'viene' : 'no viene');
    const session = summary();
    // Google tarda ~5 s en contestar: esperamos como mucho 1,5 s y el envío sigue en segundo plano (keepalive)
    const base = { ...answers(), grupo: session.grupo, sesion: session.sesion, visitante: session.visitante, test: session.test };
    const fams = famList(), quien = `${A.nombre} ${A.apellido}`;
    const sending = Promise.all([
      post({ type: 'rsvp', respuesta: { ...base, personas: 1 + fams.length, confirmado_por: '' }, session, events: T.queue.splice(0) }),
      // cada familiar va como su propia fila en Reconfirmación, vinculada a quien confirmó
      ...fams.map(nombre => post({ type: 'rsvp', respuesta: { ...base, invitado: `${nombre} (familia de ${quien})`.toLowerCase(),
        nombre, apellido: '', familia: '', familiares: '', menu: '', personas: '', confirmado_por: quien } })),
    ]);
    await Promise.race([sending, new Promise(r => setTimeout(r, 1500))]);
    lastFlush = '';
    $('th-t').innerHTML = yes() ? 'CONFIRMADO' : 'GRACIAS<br>POR AVISAR';
    const nombres = [A.nombre, ...fams].join(', ').replace(/, ([^,]*)$/, ' y $1');
    $('th-s').textContent = !yes() ? `${A.nombre}, ya quedó registrado.`
      : fams.length ? `${nombres}: los esperamos ${A.dias.join(' · ')}.` : `${A.nombre}, te esperamos: ${A.dias.join(' · ')}.`;
    $('ics').style.display = yes() ? '' : 'none';
    err('err-s', '');
    goQ('gracias');
    if (yes()) cubeRain();
  } catch {
    T.enviado = false;
    err('err-s', 'Hubo un problema. Probá de nuevo.');
  } finally { $('send').disabled = false; $('send').textContent = 'Enviar'; }
});

function cubeRain() {
  const cols = Object.values(P);
  for (let i = 0; i < 30; i++) {
    const s = 14 + Math.random() * 22;
    const b = Object.assign(document.createElement('div'), { className: 'bit' });
    b.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;background:${cols[i % cols.length]};box-shadow:${s * .15}px ${s * .15}px 0 rgba(139,94,60,.55);animation-duration:${2 + Math.random() * 2}s;animation-delay:${Math.random() * .5}s`;
    stage.append(b); setTimeout(() => b.remove(), 5000);
  }
}

$('ics').addEventListener('click', () => {
  const ev = invited.filter(k => A.dias.includes(dayLabel(k))).map(k => {
    const [s, e, t, l] = DAYS[k].ics;
    return `BEGIN:VEVENT\r\nUID:${k}-1212@landing12\r\nDTSTAMP:20261001T000000Z\r\nDTSTART:${s}\r\nDTEND:${e}\r\nSUMMARY:${t}\r\nLOCATION:${l}\r\nEND:VEVENT`;
  }).join('\r\n');
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//1212//ES\r\n${ev}\r\nEND:VCALENDAR`;
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })), download: '12-12.ics' });
  a.click();
});
$('again').addEventListener('click', () => show(0));

/* ═════════════ GO ═════════════ */
Object.values(GALLERIES).flat().forEach(src => { new Image().src = src; });
show(+QS.get('s') || 0);
requestAnimationFrame(tick);
</script>
